name: Real-voice accuracy

# Measures pitch accuracy on real singing with a human-annotated reference:
# vocadito (40 solo singers, f0 annotated by musicians, CC BY 4.0,
# https://zenodo.org/record/5578807). The dataset is downloaded here and is
# not stored in the repository; the results table is uploaded as an artifact.

on:
  workflow_dispatch:

jobs:
  vocadito:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download vocadito
        run: |
          mkdir -p eval/datasets
          curl -fsSL -o eval/datasets/vocadito.zip "https://zenodo.org/record/5578807/files/vocadito.zip?download=1"
          unzip -q eval/datasets/vocadito.zip -d eval/datasets/vocadito
          find eval/datasets/vocadito -maxdepth 3 | head -20
      - name: Evaluate
        run: npm run eval:f0 -- eval/datasets/vocadito --name "vocadito (Bittner et al. 2021, CC BY 4.0)"
      - name: Show results
        run: cat eval/results/real-voice-pitch.md
      - uses: actions/upload-artifact@v4
        with:
          name: real-voice-pitch
          path: eval/results/real-voice-pitch.md
